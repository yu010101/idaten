<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="46%" cy="40%" r="78%">
      <stop offset="0%" stop-color="#132a52"/>
      <stop offset="100%" stop-color="#0A1834"/>
    </radialGradient>
    <linearGradient id="gold" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#F6DBA0"/>
      <stop offset="55%" stop-color="#E0AC4E"/>
      <stop offset="100%" stop-color="#B8842C"/>
    </linearGradient>
    <linearGradient id="sash" x1="0%" y1="0%" x2="100%" y2="60%">
      <stop offset="0%" stop-color="#E64545"/>
      <stop offset="100%" stop-color="#A62E2E"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F6DBA0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#F6DBA0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <circle cx="298" cy="240" r="185" fill="url(#halo)"/>

  <!-- 疾走を示す風の筋 -->
  <g stroke="#7FA8D9" stroke-width="9" stroke-linecap="round" opacity="0.7" fill="none">
    <path d="M36 232 Q108 224 168 231"/>
    <path d="M28 268 Q118 260 196 269"/>
    <path d="M44 306 Q124 300 184 307"/>
  </g>
  <g stroke="#7FA8D9" stroke-width="5" stroke-linecap="round" opacity="0.45" fill="none">
    <path d="M64 198 Q126 193 168 199"/>
    <path d="M60 344 Q128 338 176 345"/>
  </g>

  <!-- 翻る領巾(肩から流れる布、疾走感) -->
  <path d="M232 208
           C 176 196, 128 210, 104 246
           C 130 232, 168 226, 202 232
           C 178 250, 160 274, 156 300
           C 186 274, 218 258, 246 250
           Z" fill="url(#sash)" opacity="0.94"/>

  <!-- 韋駄天: 前傾して駆ける俊足の神(フラットシルエット・金) -->
  <g fill="url(#gold)">
    <!-- 頭 -->
    <circle cx="292" cy="146" r="24"/>

    <!-- 前傾する胴体(走る勢い) -->
    <path d="M270 168
             L 322 158
             L 344 214
             L 316 268
             L 268 250
             L 252 200
             Z"/>

    <!-- 後方の腕(宝杵を掲げる) -->
    <path d="M320 176 L 366 150 L 378 168 L 336 196 Z"/>
    <circle cx="372" cy="140" r="15"/>
    <rect x="366" y="140" width="12" height="34" rx="6" transform="rotate(28 372 157)"/>

    <!-- 前方の腕(振り出し) -->
    <path d="M266 196 L 226 226 L 238 246 L 280 218 Z"/>

    <!-- 後ろ脚(蹴り出し、伸びる) -->
    <path d="M296 262 L 356 296 L 388 350 L 366 366 L 332 316 L 280 286 Z"/>
    <path d="M356 296 L 402 312 L 396 332 L 350 318 Z"/>

    <!-- 前脚(踏み込み) -->
    <path d="M280 258 L 262 312 L 234 356 L 210 344 L 236 302 L 258 250 Z"/>
    <path d="M234 356 L 196 372 L 202 392 L 246 376 Z"/>
  </g>
</svg>
